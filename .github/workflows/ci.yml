name: CI

on:
  pull_request:
    branches: [main]

jobs:
  style:
    name: Style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pinned so the formatter and analyser give the same answer here as on your machine
      - name: Install clang-format and cppcheck
        run: pip install clang-format==23.1.3 cppcheck==1.5.3

      - name: Check formatting
        run: make format-check

      - name: Static analysis
        run: make lint

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build
        run: make

      - name: Strict warnings
        run: make warnings

      - name: Unit tests
        run: make unit

      - name: Command-line tests
        run: make cli

      # raw sockets need root; the trace goes to 127.0.0.1 so no network is involved
      - name: Trace tests (root)
        run: sudo make root-tests

      - name: Build with AddressSanitizer and UBSan
        run: make asan

      - name: Command-line tests (sanitized)
        run: sh tests/cli.sh ./ft_traceroute_asan

      - name: Trace tests (sanitized, root)
        run: sudo make root-tests-asan
